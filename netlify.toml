# Netlify 只會讀 repo 根目錄的 netlify.toml，所以這個檔案必須放在這裡，
# 再用 base 指向實際的前端資料夾。
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 單頁應用：所有路徑都交給 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service Worker 不可被快取，否則改版後手機會一直吃舊版
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
